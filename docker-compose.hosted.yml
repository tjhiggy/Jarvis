# Hosted overlay. Requires Compose v2.24+ for !reset / !override.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.hosted.yml up --detach --build
#
# AI_PROVIDER=openai. No extra_hosts. No OLLAMA_* variables.
# Do not add an Ollama service. Do not publish ports. Never --scale.

services:
  jarvis:
    extra_hosts: !reset
    environment: !override
      - DATABASE_PATH=/app/data/discord-bot.db
      - NODE_ENV=production
      - AI_PROVIDER=openai
      - JARVIS_VERSION
      - JARVIS_COMMIT_SHA
      - JARVIS_BUILD_TIMESTAMP
      - JARVIS_ENVIRONMENT
      - DISCORD_TOKEN
      - DISCORD_CLIENT_ID
      - DISCORD_GUILD_ID
      - OPENAI_API_KEY
      - OPENAI_MODEL
      - OPENAI_TIMEOUT_MS
      - OPENAI_MAX_RETRIES
      - TAVILY_API_KEY
      - WEB_SEARCH_TIMEOUT_MS
      - WEB_SEARCH_CACHE_TTL_MS
      - WEB_SEARCH_MAX_RESULTS
      - LOG_LEVEL
      - MAX_HISTORY_MESSAGES
      - MAX_STORED_MESSAGES
      - HISTORY_RETENTION_DAYS
      - MAX_INPUT_CHARS
      - RATE_LIMIT_REQUESTS
      - RATE_LIMIT_WINDOW_MS
      - PERSONA_PROMPT_PATH
      - FAQ_CATALOG_PATH
      - SLEEPER_LEAGUE_ID
      - GITHUB_OWNER
      - GITHUB_REPO
      - GITHUB_TOKEN
      - GITHUB_TIMEOUT_MS
      - POLL_ADMIN_USER_IDS
      - POLL_VOTER_SECRET
      - POLL_RETENTION_DAYS
      - POLL_EXPIRY_CHECK_SECONDS
      - ENGAGEMENT_ENABLED
      - ENGAGEMENT_INTRODUCTION_CHANNEL_ID
      - ENGAGEMENT_SUGGESTION_CHANNEL_ID
      - ENGAGEMENT_EVENT_CHANNEL_ID
      - ENGAGEMENT_RECAP_CHANNEL_ID
      - ENGAGEMENT_ACTIVITY_CHANNEL_ID
      - ENGAGEMENT_BIRTHDAY_CHANNEL_ID
      - ENGAGEMENT_ROLE_MENU_OPTIONS
      - ENGAGEMENT_ADMIN_ROLE_IDS
      - ENGAGEMENT_RECAP_SCHEDULE
      - ENGAGEMENT_RECAP_TIMEZONE
      - ENGAGEMENT_RETENTION_DAYS
      - ENGAGEMENT_MAX_RECORDS_PER_USER
      - ENGAGEMENT_MAX_PARTICIPANTS
      - ALLOWED_CHANNEL_IDS
      - RESTRAINED_CHANNEL_IDS
      - ENGAGEMENT_RSS_CHANNEL_ID
      - ENGAGEMENT_RSS_ALLOWED_HOSTS
      - ENGAGEMENT_PROACTIVE_CATALOG_PATH
      - ENGAGEMENT_QUIET_NUDGE_EARTHLINGS_CHANNEL_ID
      - ENGAGEMENT_QUIET_NUDGE_TEST_CHANNEL_ID
      - ENGAGEMENT_QUIET_NUDGE_EARTHLINGS_WINDOW_MINUTES
      - ENGAGEMENT_QUIET_NUDGE_TEST_WINDOW_MINUTES
      - IMAGE_GENERATION_ENABLED
      - IMAGE_GENERATION_CHANNEL_ID
      - IMAGE_GENERATION_MODEL
      - IMAGE_GENERATION_TIMEOUT_MS
      - ADMIN_CONSOLE_ENABLED
      - ADMIN_CONSOLE_HOST
      - ADMIN_CONSOLE_PORT
      - ADMIN_CONSOLE_TOKEN
      - COMMAND_DECK_API_TOKEN
      - COMMAND_DECK_API_ALLOWED_ORIGINS
      - COMMAND_DECK_API_RATE_LIMIT
      - COMMAND_DECK_API_WINDOW_SECONDS
      - COMMAND_DECK_API_MAX_CLOCK_SKEW_SECONDS
