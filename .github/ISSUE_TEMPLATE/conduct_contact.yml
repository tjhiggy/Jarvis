name: Conduct contact route request
description: Ask for a private conduct-reporting route without identifying people or describing the incident.
title: '[Conduct contact request] '
body:
  - type: markdown
    attributes:
      value: |
        This is a public routing request, not a conduct report. Do not identify
        anyone involved, describe the conduct, quote messages, provide dates or
        locations, or include private identifiers, evidence, screenshots, logs,
        or attachments.
  - type: checkboxes
    id: detail-free-request
    attributes:
      label: Detail-free request
      options:
        - label: I am only requesting a private reporting route and have included no incident or sensitive details.
          required: true
