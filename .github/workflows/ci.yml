name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify shipped feature inventory
        run: npm run features:check
      - name: Verify platform recovery matrix
        run: npm run recovery:check
      - name: Run focused platform recovery verification
        run: npm run recovery:verify
      - name: Run tests
        run: npm test
      - name: Build TypeScript
        run: npm run build
      - name: Validate documentation
        run: npm run docs:check
