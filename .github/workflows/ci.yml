name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Sites Command Deck dependencies
        run: npm ci --prefix sites/command-deck
      - name: Verify shipped feature inventory
        run: npm run features:check
      - name: Verify platform recovery matrix
        run: npm run recovery:check
      - name: Run focused platform recovery verification
        run: npm run recovery:verify
      - name: Verify Discord journey matrix
        run: npm run journeys:check
      - name: Run focused Discord journey verification
        run: npm run journeys:verify
      - name: Verify Command Deck cutover
        run: npm run command-deck-cutover:verify
      - name: Run tests
        run: npm test
      - name: Build TypeScript
        run: npm run build
      - name: Verify Sites Command Deck
        run: |
          npm test --prefix sites/command-deck
          npm run lint --prefix sites/command-deck
          npm run build --prefix sites/command-deck
      - name: Validate documentation
        run: npm run docs:check
