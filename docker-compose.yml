services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvis-discord-bot:local
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/discord-bot.db
      NODE_ENV: production
    read_only: true
    init: true
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.exit(0)']
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - host.docker.internal:host-gateway
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - jarvis-data:/app/data
    stop_grace_period: 30s

volumes:
  jarvis-data:
